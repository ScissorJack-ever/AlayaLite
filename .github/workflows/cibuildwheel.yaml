---
name: Build Wheels

on  :
  workflow_dispatch:
  push:
    branches: [test/ci]
  #   tags:
  #     - 'v*'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          arch: x86_64
          build: cp3{8,9,10,11,12,13}-*
        - os: ubuntu-24.04-arm
          arch: aarch64
          build: cp3{8,9,10,11,12,13}-*
        - os: macos-15-intel
          arch: x86_64
          build: cp3{8,9,10,11,12,13}-*
        - os: macos-14
          arch: arm64
          build: cp3{8,9,10,11,12,13}-*
        - os: windows-2022
          arch: AMD64
          build: cp3{8,9,10,11,12,13}-*

    env:
      CONAN_NON_INTERACTIVE: 1
      # CI specific config: mount Conan, uv, and pip cache in Linux Docker
      CIBW_CONTAINER_ENGINE: >-
        docker; create_args: -v /home/runner/.conan2:/root/.conan2 -v /home/runner/.cache/uv:/root/.cache/uv
        -v /home/runner/.cache/pip:/root/.cache/pip
      CIBW_BUILD: ${{ matrix.build }}
      CIBW_ARCHS_LINUX: ${{ matrix.arch }}
      CIBW_ARCHS_MACOS: ${{ matrix.arch }}
      CIBW_ARCHS_WINDOWS: ${{ matrix.arch }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        cache-local-path: ${{ runner.os == 'Linux' && '/home/runner/.cache/uv' || '' }}

    - name: Restore Conan cache
      uses: ./.github/actions/cache-restore

    - name: Ensure pip cache directory exists
      if: runner.os == 'Linux'
      run: mkdir -p /home/runner/.cache/pip

    - name: Restore pip cache
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        path: /home/runner/.cache/pip
        key: pip-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          pip-${{ runner.os }}-${{ matrix.arch }}-
          pip-${{ runner.os }}-

    - name: Build wheels
      uses: pypa/cibuildwheel@v3.3

    - name: Upload wheels artifact
      id: upload_wheels
      uses: actions/upload-artifact@v4
      with:
        name: cibw-wheels-${{ matrix.os }}-${{ matrix.arch }}
        path: ./wheelhouse/*.whl
        compression-level: 0

